<!doctype html><html lang="de"><meta charset="utf-8"><title>Gorillas Audioprüfung</title>
<style>body{font:16px monospace;background:#f3eedf;color:#252d31;padding:30px}button{font:inherit;padding:12px;margin:10px 0}li{margin:10px 0}</style>
<h1>Web-Audio-Prüfung</h1><p>Rendert alle Spieleffekte und prüft ihr Signal sowie Stummschaltung. Es werden keine Mikrofone verwendet.</p>
<button id="run">Audio prüfen</button><ul id="results"></ul><script src="../sound.js"></script>
<script>
document.getElementById('run').onclick = async () => {
  const list = document.getElementById('results'); list.replaceChildren();
  for (const effect of ['throw','building','gorilla','miss','round','match','cheer','champion','muted']) {
    const item = document.createElement('li'); list.append(item);
    try {
      const context = new OfflineAudioContext(1, 44100 * 3, 44100);
      // Offline contexts render on startRendering rather than resume.
      const wrapper = { get currentTime(){ return context.currentTime; }, state:'running', destination:context.destination,
        createGain:context.createGain.bind(context), createOscillator:context.createOscillator.bind(context) };
      const sound = new GorillaSound(() => wrapper);
      if (effect === 'muted') sound.setEnabled(false);
      sound.play(effect === 'muted' ? 'match' : effect);
      const buffer = await context.startRendering(); const samples = buffer.getChannelData(0);
      const peak = samples.reduce((max,n) => Math.max(max,Math.abs(n)), 0);
      const pass = effect === 'muted' ? peak === 0 : peak > .01 && peak < .2;
      item.textContent = `${pass ? 'PASS' : 'FAIL'} ${effect}: Signalspitze ${peak.toFixed(4)}`;
    } catch (error) { item.textContent = `FAIL ${effect}: ${error.message}`; }
  }
};
</script></html>
